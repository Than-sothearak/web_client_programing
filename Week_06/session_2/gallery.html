<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Image Gallery</title>

  <link rel="stylesheet" href="gallery.css">
</head>
<body>

<div class="gallery-container">
<h1 class="title">Image gallery</h1>
    <!-- Main Image -->
    <img id="main-image" src="/images/computer.png" alt="Main Image">

    <!-- Thumbnail Images -->
    <div class="thumbnails">
      <img class="thumb active" src="../../images/computer.png" alt="Thumbnail 1">
      <img class="thumb" src="../../images/shirt-1.jpg" alt="Thumbnail 2">
      <img class="thumb" src="../../images/shirt-2.jpg" alt="Thumbnail 3">
      <img class="thumb" src="../../images/shirt.webp" alt="Thumbnail 4">
    </div>

  </div>

  <script src="gallery.js"></script>
</body>
</html>
